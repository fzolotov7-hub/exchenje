<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXCHANGE — Панель администратора</title>
<style>
:root{--bg:#101216;--panel:#202329;--panel2:#292d34;--line:#373c45;--muted:#a7adb8;--blue:#2685f5;--green:#27c58b;--red:#f05d67;--yellow:#f3b94f;--text:#f4f6fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:220px;background:#171a20;border-right:1px solid var(--line);padding:18px 12px;flex-shrink:0}.brand{font-size:19px;font-weight:800;letter-spacing:2px;padding:4px 10px 24px;color:#fff}.brand span{color:var(--blue)}.nav button{display:flex;width:100%;align-items:center;gap:12px;padding:12px 13px;margin:3px 0;border:0;border-radius:8px;background:transparent;color:#c8cdd6;text-align:left;cursor:pointer;font-size:14px}.nav button:hover,.nav button.active{background:#203c61;color:white}.ico{width:20px;text-align:center;color:#83baff}.sidefoot{margin-top:24px;padding:12px;background:var(--panel);border-radius:9px;color:var(--muted);font-size:12px}.main{flex:1;min-width:0;padding:26px 30px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top small{color:var(--muted)}h1{font-size:24px;margin:0 0 6px}.sub{color:var(--muted)}.btn{background:var(--blue);border:0;color:white;padding:9px 14px;border-radius:7px;cursor:pointer;font-weight:600}.btn.secondary{background:#3a404a}.btn.red{background:#a83c48}.btn.green{background:#16865f}.btn:disabled{opacity:.4;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:18px 0}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}.metric{font-size:24px;font-weight:750;margin-top:9px}.muted{color:var(--muted)}.sectiongrid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.panel h3{margin:0 0 15px;font-size:15px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:500;font-size:12px}td{font-size:13px}.pill{display:inline-block;border-radius:20px;padding:4px 8px;background:#333943;font-size:11px}.pill.green{color:#5ce0ad;background:#173d32}.pill.yellow{color:#ffd17a;background:#47391d}.pill.red{color:#ff9299;background:#48252b}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button,.chip{background:#292e36;color:#d9dee7;border:1px solid var(--line);padding:9px 15px;border-radius:8px;cursor:pointer}.tabs button.active{background:#174d84;border-color:#277fd1;color:#fff}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.filters input,.filters select,input,select,textarea{background:#171a20;color:#fff;border:1px solid #454b56;padding:10px;border-radius:7px}.filters input{min-width:170px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.empty{padding:30px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px;color:var(--muted)}.field input,.field select{width:100%}.switch{accent-color:var(--blue);width:18px;height:18px}.item{padding:13px;background:var(--panel2);border-radius:8px;margin:9px 0}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px}.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(520px,100%)}.toast{position:fixed;bottom:20px;right:20px;background:#263b32;border:1px solid #2e8060;padding:12px 18px;border-radius:9px;display:none}.bar{height:8px;background:#363c46;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}@media(max-width:850px){.side{width:66px;padding:12px 6px}.brand{font-size:0;padding:8px}.brand:first-letter{font-size:20px}.nav button{justify-content:center;font-size:0}.ico{font-size:18px}.sidefoot{display:none}.main{padding:18px 12px}.cards{grid-template-columns:repeat(2,1fr)}.sectiongrid{grid-template-columns:1fr}}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.metric{font-size:19px}.formgrid{grid-template-columns:1fr}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body><div class="app"><aside class="side"><div class="brand">EX<span>CHANGE</span></div><nav class="nav" id="nav">
<button data-page="home" class="active"><b class="ico">⌂</b>Главная</button>
<button data-page="requests"><b class="ico">▤</b>Заявки</button>
<button data-page="deals"><b class="ico">⇄</b>Сделки</button>
<button data-page="users"><b class="ico">♙</b>Пользователи</button>
<button data-page="disputes"><b class="ico">⚑</b>Споры</button>
<button data-page="rates"><b class="ico">₮</b>Курсы валют</button>
<button data-page="stats"><b class="ico">▥</b>Статистика</button>
<button data-page="requisites"><b class="ico">▣</b>Реквизиты</button>
<button data-page="employees"><b class="ico">♧</b>Сотрудники</button>
<button data-page="notifications"><b class="ico">♢</b>Уведомления</button>
<button data-page="settings"><b class="ico">⚙</b>Настройки</button>
</nav><div class="sidefoot">Панель администратора<br><span id="authState" style="color:#f3b94f">●</span> Проверка доступа</div></aside>
<main class="main"><div class="top"><div><h1 id="pageTitle">Панель администратора</h1><small id="pageSub">Обзор работы обменника</small></div><div><span class="muted" id="adminIdentity">Не авторизован</span>　<button class="btn" id="telegramLogin" onclick="telegramLogin()">Войти через Telegram</button><button class="btn secondary hidden" id="logoutBtn" onclick="logout()">Выйти</button></div></div><div id="content"></div></main></div><div class="toast" id="toast"></div><div class="modal hidden" id="modal"><div class="modalbox"><div class="row"><h3 id="modalTitle">Добавить</h3><button class="btn secondary" onclick="closeModal()">✕</button></div><div id="modalBody"></div><div class="row" style="margin-top:18px"><button class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn" onclick="saveModal()">Сохранить</button></div></div></div>
<script>
const SUPABASE_URL = 'https://ckcswfutgpakaaygjkgo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fLAKKyjhcYcubZ3myuyVGg_-ukFc52f';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const rates = {USDT: null, USD: null, EUR: null};
let page = 'home';
let session = null;
let isAdmin = false;
let requestRows = [];
let registrationRows = [];
let lastError = '';

const titles = {
  home:['Панель администратора','Обзор работы обменника'],
  requests:['Заявки','Заявки, созданные клиентами'],
  deals:['Сделки','Операции обмена и их статусы'],
  users:['Пользователи','Зарегистрированные клиенты'],
  disputes:['Споры','Обращения и спорные операции'],
  rates:['Курсы валют','Управление курсами обмена'],
  stats:['Статистика','Показатели работы сервиса'],
  requisites:['Реквизиты','Платёжные реквизиты сервиса'],
  employees:['Сотрудники','Управление доступом команды'],
  notifications:['Уведомления','События и оповещения сервиса'],
  settings:['Настройки','Параметры и безопасность']
};

function toast(message) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.style.display = 'block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.style.display = 'none', 3000);
}
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}
function fmt(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—';
}
function table(rows, heads) {
  return `<div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows || ''}</tbody></table></div>`;
}
function empty(title, detail) {
  return `<div class="empty"><b>${esc(title)}</b><p class="muted">${esc(detail)}</p></div>`;
}
function go(nextPage) {
  if (!titles[nextPage]) return;
  page = nextPage;
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  document.getElementById('pageTitle').textContent = titles[page][0];
  document.getElementById('pageSub').textContent = titles[page][1];
  render();
}
document.getElementById('nav').addEventListener('click', event => {
  const button = event.target.closest('button[data-page]');
  if (button) go(button.dataset.page);
});

async function telegramLogin() {
  const {error} = await db.auth.signInWithOAuth({
    provider: 'custom:telegram',
    options: {redirectTo: window.location.origin + window.location.pathname}
  });
  if (error) toast('Не удалось начать вход: ' + error.message);
}
async function logout() {
  const {error} = await db.auth.signOut();
  if (error) return toast('Ошибка выхода: ' + error.message);
  session = null;
  isAdmin = false;
  updateAuthUI();
  render();
  toast('Вы вышли из панели');
}
function updateAuthUI() {
  document.getElementById('telegramLogin').classList.toggle('hidden', !!session);
  document.getElementById('logoutBtn').classList.toggle('hidden', !session);
  document.getElementById('adminIdentity').textContent = session
    ? (session.user.user_metadata?.name || session.user.user_metadata?.full_name || 'Telegram-пользователь')
    : 'Не авторизован';
  const state = document.getElementById('authState');
  state.textContent = isAdmin ? '● Администратор' : session ? '● Проверка прав' : '● Нет входа';
  state.style.color = isAdmin ? '#5ce0ad' : '#f3b94f';
}
async function verifyAdmin() {
  if (!session) { isAdmin = false; updateAuthUI(); render(); return; }
  // Доступ разрешается только пользователю, чей UUID добавлен владельцем в public.admin_users.
  const {data, error} = await db.from('admin_users').select('user_id').eq('user_id', session.user.id).maybeSingle();
  if (error) {
    isAdmin = false;
    lastError = error.message;
    updateAuthUI();
    render();
    return;
  }
  isAdmin = !!data;
  updateAuthUI();
  if (isAdmin) {
    await Promise.all([loadRates(), loadRequests(), loadRegistrations()]);
  } else {
    render();
  }
}
db.auth.onAuthStateChange((_event, nextSession) => {
  session = nextSession;
  // Supabase рекомендует не запускать дополнительные auth-запросы внутри callback.
  setTimeout(() => verifyAdmin(), 0);
});
async function initAuth() {
  const {data, error} = await db.auth.getSession();
  if (error) { lastError = error.message; }
  session = data?.session || null;
  await verifyAdmin();
}

async function loadRates() {
  const {data, error} = await db.from('rates').select('currency,rate');
  if (error) { lastError = 'Курсы: ' + error.message; render(); return; }
  Object.keys(rates).forEach(k => rates[k] = null);
  (data || []).forEach(row => {
    const key = String(row.currency || '').toUpperCase();
    if (Object.prototype.hasOwnProperty.call(rates,key)) rates[key] = Number(row.rate);
  });
  render();
}
async function saveRates() {
  if (!isAdmin) return toast('Нет прав администратора');
  const updates = {};
  for (const key of Object.keys(rates)) {
    const input = document.getElementById('rate' + key);
    const value = Number(String(input?.value || '').replace(',','.'));
    if (!Number.isFinite(value) || value <= 0) return toast('Проверь курс ' + key);
    updates[key] = value;
  }
  for (const [currency, rate] of Object.entries(updates)) {
    const {error} = await db.from('rates').update({rate}).eq('currency',currency);
    if (error) return toast('Не удалось сохранить ' + currency + ': ' + error.message);
  }
  await loadRates();
  toast('Курсы успешно сохранены');
}
async function loadRequests() {
  const {data,error} = await db.from('request').select('*').limit(200);
  if (error) { lastError = 'Заявки: ' + error.message; requestRows = []; }
  else requestRows = data || [];
  render();
}
async function loadRegistrations() {
  const {data,error} = await db.from('registrations').select('*').limit(500);
  if (error) { lastError = 'Пользователи: ' + error.message; registrationRows = []; }
  else registrationRows = data || [];
  render();
}
function rowToCells(row, keys) {
  return keys.map(key => `<td>${esc(row[key] ?? '—')}</td>`).join('');
}
function getColumns(rows, preferred) {
  if (!rows.length) return [];
  const keys = Object.keys(rows[0]);
  return preferred.filter(k => keys.includes(k)).slice(0,7);
}
function renderDataTable(rows, preferred, emptyText) {
  if (!rows.length) return empty('Записей пока нет', emptyText);
  const cols = getColumns(rows, preferred);
  if (!cols.length) return empty('Нужно сопоставить поля таблицы','Данные найдены, но названия её столбцов отличаются от ожидаемых. Сначала уточним структуру и добавим правильное отображение.');
  return table(rows.map(row => `<tr>${rowToCells(row,cols)}</tr>`).join(''),cols);
}
function home(c) {
  const rateCards = Object.entries(rates).map(([currency,rate]) =>
    `<div class="item row"><b>${currency}</b><b>${rate === null ? '—' : fmt(rate)+' ₽'}</b></div>`
  ).join('');
  c.innerHTML = `
    <div class="cards">
      <div class="card"><span class="muted">Заявки</span><div class="metric">${isAdmin ? requestRows.length : '—'}</div><span class="muted">Из таблицы request</span></div>
      <div class="card"><span class="muted">Пользователи</span><div class="metric">${isAdmin ? registrationRows.length : '—'}</div><span class="muted">Из таблицы registrations</span></div>
      <div class="card"><span class="muted">Курс USDT</span><div class="metric">${rates.USDT === null ? '—' : fmt(rates.USDT)+' ₽'}</div><span class="muted">Из Supabase</span></div>
      <div class="card"><span class="muted">Статус</span><div class="metric" style="font-size:18px">${isAdmin ? 'Подключено' : 'Закрыто'}</div><span class="muted">Доступ администратора</span></div>
    </div>
    <div class="sectiongrid">
      <div class="panel"><h3>Последние заявки</h3>
        ${isAdmin ? renderDataTable(requestRows.slice(0,5),['id','status','created_at','currency','amount'],'В таблице request пока нет записей.') : empty('Требуется вход','Войдите через Telegram и подтвердите права администратора.')}
        <button class="btn secondary" onclick="go('requests')">Все заявки</button>
      </div>
      <div class="panel"><h3>Курсы валют</h3>${rateCards}<button class="btn secondary" onclick="go('rates')">Открыть курсы</button></div>
    </div>`;
  return c;
}
function requestsPage(c) {
  c.innerHTML = `<div class="panel"><div class="row"><h3>Заявки клиентов</h3><button class="btn secondary" onclick="loadRequests()">Обновить</button></div>
  ${renderDataTable(requestRows,['id','status','created_at','give','receive','amount','user_id','give_amount','give_currency','get_amount','get_currency','bank'],'Заявок пока нет. Если таблица request недоступна, проверьте её права SELECT в Supabase.')}</div>`;
  return c;
}
function dealsPage(c) {
  c.innerHTML = `<div class="panel"><h3>Сделки</h3>${empty('Раздел подготовлен','Сейчас в Supabase подтверждена таблица request, но отдельная таблица сделок и её статусы ещё не согласованы. Не показываем вымышленные сделки.')}</div>`;
  return c;
}
function usersPage(c) {
  c.innerHTML = `<div class="panel"><div class="row"><h3>Пользователи</h3><button class="btn secondary" onclick="loadRegistrations()">Обновить</button></div>
  ${renderDataTable(registrationRows,['id','telegram_id','username','first_name','last_name','created_at'],'Пользователей пока нет либо таблица registrations недоступна для чтения.')}</div>`;
  return c;
}
function disputesPage(c) {
  c.innerHTML = `<div class="panel"><h3>Споры</h3>${empty('Таблица споров не подключена','Для этого раздела потребуется отдельная таблица споров и защищённые правила доступа. Сейчас никаких фиктивных обращений нет.')}</div>`;
  return c;
}
function ratesPage(c) {
  c.innerHTML = `<div class="panel"><h3>Курсы валют к рублю</h3>
    <div class="formgrid">${Object.entries(rates).map(([key,value])=>`<label class="field">${key} / RUB<input id="rate${key}" type="number" min="0.01" step="0.01" value="${value ?? ''}" placeholder="Загрузка..."></label>`).join('')}</div>
    <button class="btn" style="margin-top:14px" onclick="saveRates()" ${isAdmin?'':'disabled'}>Сохранить курсы</button>
    <p class="muted" style="margin-top:12px">Сохранение доступно только после авторизации администратора и настройки RLS для таблицы rates.</p></div>`;
  return c;
}
function statsPage(c) {
  c.innerHTML = `<div class="panel"><h3>Статистика</h3>${empty('Пока нет подтверждённых данных','Статистика будет рассчитываться из реальных сделок после согласования структуры таблицы и статусов.')}</div>`;
  return c;
}
function requisitesPage(c) {
  c.innerHTML = `<div class="panel"><h3>Реквизиты</h3>${empty('Реквизиты не подключены','Банковские реквизиты не храним в localStorage и не подменяем демонстрационными значениями. Подключим после создания защищённой таблицы.')}</div>`;
  return c;
}
function employeesPage(c) {
  c.innerHTML = `<div class="panel"><h3>Сотрудники</h3>${empty('Управление сотрудниками не подключено','Сначала настроим проверенный список администраторов. Добавление сотрудников появится после проектирования ролей и прав.')}</div>`;
  return c;
}
function notificationsPage(c) {
  c.innerHTML = `<div class="panel"><h3>Уведомления</h3>${empty('Уведомлений пока нет','Подключим события о новых заявках, изменении статусов и спорах после настройки серверной логики.')}</div>`;
  return c;
}
function settingsPage(c) {
  c.innerHTML = `<div class="sectiongrid">
    <div class="panel"><h3>Параметры обмена</h3><p class="muted">Курсы валют находятся в разделе «Курсы валют». Комиссию добавим после создания соответствующей настройки в базе.</p><button class="btn secondary" onclick="go('rates')">Перейти к курсам</button></div>
    <div class="panel"><h3>Безопасность</h3><p class="muted">${session ? 'Telegram-сессия активна.' : 'Вход в панель не выполнен.'}</p><p class="muted">Права проверяются по таблице admin_users. Не используйте service_role key в HTML.</p>${session ? `<p class="muted">ID аккаунта: <code>${esc(session.user.id)}</code></p>` : ''}</div>
  </div>`;
  return c;
}
function render() {
  const content = document.getElementById('content');
  if (!isAdmin) {
    content.innerHTML = `<div class="panel"><h3>${session ? 'Аккаунт Telegram подтверждён' : 'Вход администратора'}</h3>
      <p class="muted">${session ? 'Этот Telegram-аккаунт ещё не добавлен в список администраторов Supabase.' : 'Для доступа к панели войдите через Telegram.'}</p>
      ${session ? `<p class="muted">Ваш UUID: <code>${esc(session.user.id)}</code></p><p class="muted">Добавьте этот UUID в public.admin_users через SQL Editor Supabase. Инструкция приложена отдельно.</p>` : '<button class="btn" onclick="telegramLogin()">Войти через Telegram</button>'}
      ${lastError ? `<p class="muted">Техническая информация: ${esc(lastError)}</p>` : ''}
    </div>`;
    return;
  }
  if (page === 'home') home(content);
  else if (page === 'requests') requestsPage(content);
  else if (page === 'deals') dealsPage(content);
  else if (page === 'users') usersPage(content);
  else if (page === 'disputes') disputesPage(content);
  else if (page === 'rates') ratesPage(content);
  else if (page === 'stats') statsPage(content);
  else if (page === 'requisites') requisitesPage(content);
  else if (page === 'employees') employeesPage(content);
  else if (page === 'notifications') notificationsPage(content);
  else if (page === 'settings') settingsPage(content);
}
render();
initAuth();
</script>
</body></html>
