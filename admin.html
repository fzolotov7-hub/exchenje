<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXCHANGE — Панель администратора</title>
<style>
:root{--bg:#101216;--panel:#202329;--panel2:#292d34;--line:#373c45;--muted:#a7adb8;--blue:#2685f5;--green:#27c58b;--red:#f05d67;--yellow:#f3b94f;--text:#f4f6fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:220px;background:#171a20;border-right:1px solid var(--line);padding:18px 12px;flex-shrink:0}.brand{font-size:19px;font-weight:800;letter-spacing:2px;padding:4px 10px 24px;color:#fff}.brand span{color:var(--blue)}.nav button{display:flex;width:100%;align-items:center;gap:12px;padding:12px 13px;margin:3px 0;border:0;border-radius:8px;background:transparent;color:#c8cdd6;text-align:left;cursor:pointer;font-size:14px}.nav button:hover,.nav button.active{background:#203c61;color:white}.ico{width:20px;text-align:center;color:#83baff}.sidefoot{margin-top:24px;padding:12px;background:var(--panel);border-radius:9px;color:var(--muted);font-size:12px}.main{flex:1;min-width:0;padding:26px 30px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top small{color:var(--muted)}h1{font-size:24px;margin:0 0 6px}.sub{color:var(--muted)}.btn{background:var(--blue);border:0;color:white;padding:9px 14px;border-radius:7px;cursor:pointer;font-weight:600}.btn.secondary{background:#3a404a}.btn.red{background:#a83c48}.btn.green{background:#16865f}.btn:disabled{opacity:.4;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:18px 0}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}.metric{font-size:24px;font-weight:750;margin-top:9px}.muted{color:var(--muted)}.sectiongrid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.panel h3{margin:0 0 15px;font-size:15px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:500;font-size:12px}td{font-size:13px}.pill{display:inline-block;border-radius:20px;padding:4px 8px;background:#333943;font-size:11px}.pill.green{color:#5ce0ad;background:#173d32}.pill.yellow{color:#ffd17a;background:#47391d}.pill.red{color:#ff9299;background:#48252b}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button,.chip{background:#292e36;color:#d9dee7;border:1px solid var(--line);padding:9px 15px;border-radius:8px;cursor:pointer}.tabs button.active{background:#174d84;border-color:#277fd1;color:#fff}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.filters input,.filters select,input,select,textarea{background:#171a20;color:#fff;border:1px solid #454b56;padding:10px;border-radius:7px}.filters input{min-width:170px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.empty{padding:30px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px;color:var(--muted)}.field input,.field select{width:100%}.switch{accent-color:var(--blue);width:18px;height:18px}.item{padding:13px;background:var(--panel2);border-radius:8px;margin:9px 0}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px}.modalbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(520px,100%)}.toast{position:fixed;bottom:20px;right:20px;background:#263b32;border:1px solid #2e8060;padding:12px 18px;border-radius:9px;display:none}.bar{height:8px;background:#363c46;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}@media(max-width:850px){.side{width:66px;padding:12px 6px}.brand{font-size:0;padding:8px}.brand:first-letter{font-size:20px}.nav button{justify-content:center;font-size:0}.ico{font-size:18px}.sidefoot{display:none}.main{padding:18px 12px}.cards{grid-template-columns:repeat(2,1fr)}.sectiongrid{grid-template-columns:1fr}}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.metric{font-size:19px}.formgrid{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">EX<span>CHANGE</span></div><nav class="nav" id="nav">
<button data-page="home" class="active"><b class="ico">⌂</b>Главная</button>
<button data-page="deals"><b class="ico">⇄</b>Сделки</button>
<button data-page="disputes"><b class="ico">⚑</b>Споры</button>
<button data-page="stats"><b class="ico">▥</b>Статистика</button>
<button data-page="requisites"><b class="ico">▣</b>Реквизиты</button>
<button data-page="employees"><b class="ico">♙</b>Сотрудники</button>
<button data-page="settings"><b class="ico">⚙</b>Настройки</button></nav><div class="sidefoot">Панель администратора<br><span style="color:#5ce0ad">●</span> Демонстрационный режим</div></aside>
<main class="main"><div class="top"><div><h1 id="pageTitle">Панель администратора</h1><small id="pageSub">Обзор работы обменника</small></div><div><span class="muted">Администратор</span>　<button class="btn secondary" onclick="toast('Это демонстрационный режим')">⌕</button></div></div><div id="content"></div></main></div><div class="toast" id="toast"></div><div class="modal hidden" id="modal"><div class="modalbox"><div class="row"><h3 id="modalTitle">Добавить</h3><button class="btn secondary" onclick="closeModal()">✕</button></div><div id="modalBody"></div><div class="row" style="margin-top:18px"><button class="btn secondary" onclick="closeModal()">Отмена</button><button class="btn" onclick="saveModal()">Сохранить</button></div></div></div>
<script>
const rates={USDT:81.90,USD:81.39,EUR:90.32};
let page='home',dealTab='Приём',disputeTab='Активные',modalAction=null;
let deals=JSON.parse(localStorage.getItem('exDeals')||'[]');
if(!deals.length) deals=[{id:'EX-12456',client:'Александр К.',type:'Приём',amount:'100 000 ₽',currency:'USDT',status:'Ожидает оплаты',date:'06.11.2026 21:42'},{id:'EX-12455',client:'Иван П.',type:'Выплата',amount:'25 000 ₽',currency:'RUB',status:'В обработке',date:'06.11.2026 21:18'},{id:'EX-12454',client:'Мария С.',type:'Приём',amount:'500 USDT',currency:'USDT',status:'Завершена',date:'06.11.2026 20:51'}];
let disputes=[{id:'SP-102',client:'Александр К.',reason:'Клиент не получил выплату',status:'Открыт',date:'06.11.2026'},{id:'SP-101',client:'Иван П.',reason:'Неверная сумма перевода',status:'На рассмотрении',date:'05.11.2026'}];
let requisites=JSON.parse(localStorage.getItem('exReq')||'["Т-Банк · Карта •• 4821","Альфа-Банк · Карта •• 1092","Сбербанк · СБП","Озон Банк · Карта •• 7720"]');
let employees=['Главный администратор · Полный доступ','Оператор · Приём заявок','Оператор выплат · Выплаты'];
const titles={home:['Панель администратора','Обзор работы обменника'],deals:['Сделки','Управление приёмами и выплатами'],disputes:['Споры','Обращения и спорные операции'],stats:['Статистика','Отчёты и показатели обменника'],requisites:['Реквизиты','Банковские реквизиты и лимиты'],employees:['Сотрудники','Управление доступом команды'],settings:['Настройки','Параметры платформы']};
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('pageTitle').textContent=titles[p][0];document.getElementById('pageSub').textContent=titles[p][1];render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function table(rows,heads){return `<div class="tablewrap"><table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table></div>`}
function status(s){let c=s.includes('Заверш')||s.includes('Закрыт')?'green':s.includes('Ожидает')||s.includes('рассмотр')||s.includes('обработ')?'yellow':'red';return `<span class="pill ${c}">${s}</span>`}
function render(){let c=document.getElementById('content');if(page==='home')c=home(c);if(page==='deals')c=dealPage(c);if(page==='disputes')c=disputePage(c);if(page==='stats')c=statsPage(c);if(page==='requisites')c=requisitesPage(c);if(page==='employees')c=employeesPage(c);if(page==='settings')c=settingsPage(c)}
function home(c){c.innerHTML=`<div class="cards"><div class="card"><span class="muted">Баланс USDT</span><div class="metric">12 480 <small>USDT</small></div><span class="pill green">Доступно</span></div><div class="card"><span class="muted">Страховой лимит</span><div class="metric">8 920 <small>USDT</small></div><span class="muted">Текущий лимит</span></div><div class="card"><span class="muted">Оборот за день</span><div class="metric">₽ 745 780</div><span class="pill green">+12,8%</span></div><div class="card"><span class="muted">Открытые споры</span><div class="metric">${disputes.length}</div><span class="pill yellow">Требуют внимания</span></div></div><div class="sectiongrid"><div class="panel"><h3>Последние сделки</h3>${table(deals.slice(0,5).map(d=>`<tr><td>${d.id}</td><td>${d.client}</td><td>${d.type}</td><td>${d.amount}</td><td>${status(d.status)}</td></tr>`).join(''),['Номер','Клиент','Тип','Сумма','Статус'])}<button class="btn secondary" onclick="go('deals')">Все сделки</button></div><div class="panel"><h3>Курсы валют</h3>${Object.entries(rates).map(([k,v])=>`<div class="item row"><b>${k}</b><b>${v.toFixed(2).replace('.',',')} ₽</b></div>`).join('')}<button class="btn secondary" onclick="go('settings')">Изменить курсы</button></div></div>`;return c}
function dealPage(c){let tabs=['Приём','Выплата','Споры','Все'];let list=deals.filter(d=>dealTab==='Все'||d.type===dealTab||(dealTab==='Споры'&&d.status==='Спор'));c.innerHTML=`<div class="tabs">${tabs.map(t=>`<button class="${dealTab===t?'active':''}" onclick="dealTab='${t}';render()">${t}</button>`).join('')}</div><div class="row"><h3>${dealTab} — ${list.length}</h3><button class="btn" onclick="openAddDeal()">＋ Добавить сделку</button></div><div class="filters"><input id="dealSearch" placeholder="Поиск по номеру или клиенту" oninput="filterDeals()"><select onchange="filterStatus(this.value)"><option value="">Все статусы</option><option>Ожидает оплаты</option><option>В обработке</option><option>Завершена</option><option>Отклонена</option></select></div><div id="dealTable">${dealTable(list)}</div>`;return c}
function dealTable(list){return table(list.map(d=>`<tr><td>${d.id}</td><td>${d.client}</td><td>${d.type}</td><td>${d.amount}</td><td>${d.currency}</td><td>${status(d.status)}</td><td>${d.date}</td><td><button class="btn secondary" onclick="detail('${d.id}')">Открыть</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Сделок пока нет</td></tr>',['Номер','Клиент','Операция','Сумма','Валюта','Статус','Дата','Действия'])}
function filterDeals(){let q=document.getElementById('dealSearch').value.toLowerCase();let l=deals.filter(d=>(dealTab==='Все'||d.type===dealTab||(dealTab==='Споры'&&d.status==='Спор'))&&(d.id+d.client).toLowerCase().includes(q));document.getElementById('dealTable').innerHTML=dealTable(l)}
function filterStatus(s){let q=document.getElementById('dealSearch').value.toLowerCase();let l=deals.filter(d=>(dealTab==='Все'||d.type===dealTab)&&(d.id+d.client).toLowerCase().includes(q)&&(!s||d.status===s));document.getElementById('dealTable').innerHTML=dealTable(l)}
function detail(id){let d=deals.find(x=>x.id===id);document.getElementById('modalTitle').textContent='Сделка '+id;document.getElementById('modalBody').innerHTML=`<p>Клиент: <b>${d.client}</b></p><p>Операция: ${d.type} · ${d.amount} ${d.currency}</p><p>Статус: ${status(d.status)}</p><p>Дата: ${d.date}</p><div class="row"><button class="btn green" onclick="changeDeal('${id}','Завершена')">Подтвердить / завершить</button><button class="btn red" onclick="changeDeal('${id}','Отклонена')">Отклонить</button></div>`;document.getElementById('modal').classList.remove('hidden')}
function changeDeal(id,s){let d=deals.find(x=>x.id===id);d.status=s;persist();closeModal();render();toast('Статус сделки изменён')}
function disputePage(c){let l=disputes.filter(d=>disputeTab==='Все'||(disputeTab==='Активные'&&d.status!=='Закрыт')||(disputeTab==='Завершённые'&&d.status==='Закрыт'));c.innerHTML=`<div class="tabs">${['Активные','Завершённые','Все'].map(t=>`<button class="${disputeTab===t?'active':''}" onclick="disputeTab='${t}';render()">${t}</button>`).join('')}</div><div class="panel"><div class="row"><h3>Список споров</h3><span class="muted">${l.length} обращ.</span></div>${table(l.map(d=>`<tr><td>${d.id}</td><td>${d.client}</td><td>${d.reason}</td><td>${status(d.status)}</td><td>${d.date}</td><td><button class="btn secondary" onclick="resolve('${d.id}')">Рассмотреть</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Споров нет</td></tr>',['Номер','Клиент','Причина','Статус','Дата','Действие'])}</div>`;return c}
function resolve(id){let d=disputes.find(x=>x.id===id);d.status='Закрыт';render();toast('Спор закрыт в демо-режиме')}
function statsPage(c){c.innerHTML=`<div class="filters"><label>Период <input type="date" value="2026-11-06"></label><label>По <input type="date" value="2026-11-06"></label><select><option>Все типы оплаты</option><option>Банковская карта</option><option>СБП</option></select><button class="btn" onclick="toast('Фильтры применены')">Применить</button><button class="btn secondary" onclick="exportCSV()">Экспорт Excel / CSV</button></div><div class="cards"><div class="card"><span class="muted">Всего сделок</span><div class="metric">${deals.length}</div></div><div class="card"><span class="muted">Оборот</span><div class="metric">745 780 ₽</div></div><div class="card"><span class="muted">Приём</span><div class="metric">537 000 ₽</div></div><div class="card"><span class="muted">Выплата</span><div class="metric">208 780 ₽</div></div></div><div class="panel"><h3>Статистика операций</h3><div class="item"><div class="row"><b>Приём</b><b>537 000 ₽</b></div><div class="bar"><i style="width:72%"></i></div></div><div class="item"><div class="row"><b>Выплата</b><b>208 780 ₽</b></div><div class="bar"><i style="width:28%"></i></div></div><div class="item"><div class="row"><b>Успешные сделки</b><b>${deals.filter(d=>d.status==='Завершена').length}</b></div><div class="bar"><i style="width:65%"></i></div></div></div>`;return c}
function requisitesPage(c){c.innerHTML=`<div class="filters"><select><option>Все банки</option><option>Т-Банк</option><option>Альфа-Банк</option><option>Сбербанк</option><option>Озон Банк</option></select><select><option>Все группы</option><option>Основная</option><option>Резервная</option></select><button class="btn" onclick="openRequisite()">＋ Добавить реквизит</button></div><div class="panel"><h3>Банковские реквизиты</h3>${requisites.map((r,i)=>`<div class="item row"><div><b>${r}</b><div class="muted">Группа: Основная · Лимит: 100 000 ₽</div></div><div><span class="pill green">Активен</span> <button class="btn secondary" onclick="removeReq(${i})">Удалить</button></div></div>`).join('')}</div>`;return c}
function employeesPage(c){c.innerHTML=`<div class="row"><h3>Список сотрудников</h3><button class="btn" onclick="openEmployee()">＋ Добавить сотрудника</button></div><div class="panel">${employees.map((e,i)=>`<div class="item row"><span>${e}</span><button class="btn secondary" onclick="toast('Карточка сотрудника ${i+1}')">Открыть</button></div>`).join('')}</div>`;return c}
function settingsPage(c){c.innerHTML=`<div class="sectiongrid"><div class="panel"><h3>Курсы валют к рублю</h3><div class="formgrid">${Object.entries(rates).map(([k,v])=>`<label class="field">${k}<input id="rate${k}" type="number" step=".01" value="${v}"></label>`).join('')}</div><button class="btn" style="margin-top:14px" onclick="saveRates()">Сохранить курсы</button></div><div class="panel"><h3>Оформление</h3><label class="field">Тема интерфейса<select id="theme" onchange="setTheme(this.value)"><option value="dark">Тёмная</option><option value="darker">Очень тёмная</option></select></label><p><label><input type="checkbox" class="switch" checked> Уведомления о новых заявках</label></p><p><label><input type="checkbox" class="switch" checked> Уведомления о спорах</label></p><button class="btn secondary" onclick="toast('Настройки сохранены')">Сохранить настройки</button></div></div><div class="panel" style="margin-top:14px"><h3>Безопасность</h3><p class="muted">Доступ администратора в этой демонстрации не защищён серверной авторизацией.</p><button class="btn secondary" onclick="toast('В демо смена пароля недоступна')">Изменить пароль</button></div>`;return c}
function saveRates(){Object.keys(rates).forEach(k=>rates[k]=Number(document.getElementById('rate'+k).value)||rates[k]);toast('Курсы сохранены: USDT '+rates.USDT+', USD '+rates.USD+', EUR '+rates.EUR);go('home')}
function setTheme(v){document.body.style.setProperty('--bg',v==='darker'?'#090b0e':'#101216');toast('Тема изменена')}
function persist(){localStorage.setItem('exDeals',JSON.stringify(deals));localStorage.setItem('exReq',JSON.stringify(requisites))}
function openAddDeal(){modalAction='deal';document.getElementById('modalTitle').textContent='Новая сделка';document.getElementById('modalBody').innerHTML=`<div class="formgrid"><label class="field">Клиент<input id="mClient" placeholder="Имя клиента"></label><label class="field">Тип<select id="mType"><option>Приём</option><option>Выплата</option></select></label><label class="field">Сумма<input id="mAmount" placeholder="100 000 ₽"></label><label class="field">Валюта<select id="mCurrency"><option>USDT</option><option>RUB</option><option>USD</option><option>EUR</option></select></label></div>`;document.getElementById('modal').classList.remove('hidden')}
function openRequisite(){modalAction='req';document.getElementById('modalTitle').textContent='Добавить реквизит';document.getElementById('modalBody').innerHTML=`<label class="field">Банк<select id="mBank"><option>Т-Банк</option><option>Альфа-Банк</option><option>Сбербанк</option><option>Озон Банк</option></select></label><label class="field">Реквизит<input id="mRequisite" placeholder="Карта •• 1234 или СБП"></label>`;document.getElementById('modal').classList.remove('hidden')}
function openEmployee(){modalAction='emp';document.getElementById('modalTitle').textContent='Добавить сотрудника';document.getElementById('modalBody').innerHTML=`<label class="field">Имя сотрудника<input id="mEmp" placeholder="Имя"></label><label class="field">Роль<select id="mRole"><option>Оператор</option><option>Оператор выплат</option><option>Администратор</option></select></label>`;document.getElementById('modal').classList.remove('hidden')}
function saveModal(){if(modalAction==='deal'){deals.unshift({id:'EX-'+Math.floor(10000+Math.random()*89999),client:document.getElementById('mClient').value||'Новый клиент',type:document.getElementById('mType').value,amount:document.getElementById('mAmount').value||'0',currency:document.getElementById('mCurrency').value,status:'Ожидает оплаты',date:new Date().toLocaleString('ru-RU')});persist()}if(modalAction==='req'){requisites.push(document.getElementById('mBank').value+' · '+(document.getElementById('mRequisite').value||'Новые реквизиты'));persist()}if(modalAction==='emp')employees.push((document.getElementById('mRole').value)+' · '+(document.getElementById('mEmp').value||'Новый сотрудник'));closeModal();render();toast('Сохранено в демо')}
function removeReq(i){requisites.splice(i,1);persist();render();toast('Реквизит удалён')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function exportCSV(){let rows=[['Номер','Клиент','Тип','Сумма','Валюта','Статус','Дата'],...deals.map(d=>[d.id,d.client,d.type,d.amount,d.currency,d.status,d.date])];let csv='\ufeff'+rows.map(r=>r.join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='exchange-statistika.csv';a.click();URL.revokeObjectURL(a.href);toast('Файл статистики выгружен')}
render();
</script></body></html>
